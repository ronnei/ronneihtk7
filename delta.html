<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hướng Dẫn Cài Đặt Delta Executor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0c10;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(255, 123, 0, 0.15) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .header {
            text-align: center;
            padding: 10px 0 5px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(255, 120, 0, 0.25), rgba(200, 80, 0, 0.08));
            border: 1px solid rgba(255, 130, 0, 0.4);
            color: #ff9d3b;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255, 130, 0, 0.2);
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .header p {
            font-size: 13px;
            color: #8b92a3;
        }

        .video-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card {
            background: #12141a;
            border: 1px solid #1f232d;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
            transition: transform 0.25s ease, border-color 0.25s ease;
            cursor: pointer;
        }

        .card:hover {
            border-color: rgba(255, 140, 0, 0.5);
            transform: translateY(-2px);
        }

        .card-header {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #161922;
            border-bottom: 1px solid #1f232d;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
        }

        .platform-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .icon-android { background: rgba(52, 168, 83, 0.15); color: #34a853; border: 1px solid rgba(52, 168, 83, 0.3); }
        .icon-ios { background: rgba(0, 122, 255, 0.15); color: #007aff; border: 1px solid rgba(0, 122, 255, 0.3); }
        .icon-pc { background: rgba(168, 85, 247, 0.15); color: #a855f7; border: 1px solid rgba(168, 85, 247, 0.3); }

        .thumb-link {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000000;
            display: block;
            overflow: hidden;
        }

        .thumb-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.35s ease, filter 0.35s ease;
        }

        .card:hover .thumb-img {
            transform: scale(1.04);
            filter: brightness(1.08);
        }

        .card-footer {
            padding: 16px;
            background: #12141a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-cta {
            width: 100%;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #ff8c00 0%, #ff3b00 100%);
            box-shadow: 0 6px 20px rgba(255, 85, 0, 0.45);
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
            animation: pulse-glow 2s infinite;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }

        .btn-cta::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: 0.5s;
            animation: shine 2.5s infinite;
        }

        .btn-cta:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 28px rgba(255, 85, 0, 0.65);
            filter: brightness(1.1);
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(255, 90, 0, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(255, 90, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 90, 0, 0); }
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        .footer {
            margin-top: 10px;
            font-size: 12px;
            color: #4b505e;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="brand-badge">⚡ DELTA TUTORIAL</div>
            <h1>Hướng Dẫn Cài Đặt Delta</h1>
            <p>Chọn phiên bản phù hợp bên dưới để xem video chi tiết</p>
        </div>

        <div class="video-list">
            
            <!-- Video 1: Android -->
            <div class="card" onclick="openYoutube('https://www.youtube.com/watch?v=BvbzpvdgQF0')">
                <div class="card-header">
                    <div class="card-title">
                        <div class="platform-icon icon-android">🤖</div>
                        <span>Cách cài Delta trên Android</span>
                    </div>
                </div>
                <div class="thumb-link">
                    <img class="thumb-img" src="https://img.youtube.com/vi/BvbzpvdgQF0/hqdefault.jpg" alt="Android Tutorial">
                </div>
                <div class="card-footer">
                    <button class="btn-cta">
                        🔥 BẤM XEM HƯỚNG DẪN NGAY 🔥
                    </button>
                </div>
            </div>

            <!-- Video 2: iOS -->
            <div class="card" onclick="openYoutube('https://www.youtube.com/watch?v=fnfZ5mAaaeQ')">
                <div class="card-header">
                    <div class="card-title">
                        <div class="platform-icon icon-ios">🍎</div>
                        <span>Cách cài Delta trên iOS</span>
                    </div>
                </div>
                <div class="thumb-link">
                    <img class="thumb-img" src="https://img.youtube.com/vi/fnfZ5mAaaeQ/hqdefault.jpg" alt="iOS Tutorial">
                </div>
                <div class="card-footer">
                    <button class="btn-cta">
                        🔥 BẤM XEM HƯỚNG DẪN NGAY 🔥
                    </button>
                </div>
            </div>

            <!-- Video 3: PC + MacBook -->
            <div class="card" onclick="openYoutube('https://www.youtube.com/watch?v=ot489apJXR4')">
                <div class="card-header">
                    <div class="card-title">
                        <div class="platform-icon icon-pc">💻</div>
                        <span>Cách cài Delta trên PC + MacBook</span>
                    </div>
                </div>
                <div class="thumb-link">
                    <img class="thumb-img" src="https://img.youtube.com/vi/ot489apJXR4/hqdefault.jpg" alt="PC Tutorial">
                </div>
                <div class="card-footer">
                    <button class="btn-cta">
                        🔥 BẤM XEM HƯỚNG DẪN NGAY 🔥
                    </button>
                </div>
            </div>

        </div>

        <div class="footer">
            Delta Guide System
        </div>
    </div>

    <script>
        function openYoutube(url) {
            window.location.href = url;
        }
    </script>
</body>
</html>
